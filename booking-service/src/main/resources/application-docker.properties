spring.application.name=booking-service
server.port=8083
eureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka/
spring.config.import=optional:configserver:http://config-server:8888/

spring.datasource.url=jdbc:mysql://mysql:3306/booking_db?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=password

app.services.event.url=http://event-service:8082
app.services.user.url=http://user-service:8081
app.services.payment.url=http://payment-service:8084
